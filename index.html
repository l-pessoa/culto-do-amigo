<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Culto do Amigo — AEC</title>
  <meta name="description" content="Você é nosso convidado especial. Conheça o Culto do Amigo: louvores, lema, pregação e convite.">
  <link rel="stylesheet" href="css/style.css">

<body data-page="index">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">AEC</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list">
          <span class="sr-only">Abrir menu</span>
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
        <ul id="nav-list" class="nav-list">
          <li><a href="index.html" data-page="index">Home</a></li>
          <li><a href="louvores.html" data-page="louvores">Louvores</a></li>
          <li><a href="tema.html" data-page="tema">Lema</a></li>
          <li><a href="pregacao.html" data-page="pregacao">Pregação</a></li>
          <li><a href="convite.html" data-page="convite">Convite</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero reveal">
      <div class="ornament ornament-left tone-gold motif-wave" aria-hidden="true">
        <svg viewBox="0 0 60 140" fill="currentColor">
          <rect class="wave-bar" x="4" y="70" width="8" height="40" rx="4"/>
          <rect class="wave-bar" x="18" y="50" width="8" height="60" rx="4" style="animation-delay:.15s"/>
          <rect class="wave-bar" x="32" y="30" width="8" height="80" rx="4" style="animation-delay:.3s"/>
          <rect class="wave-bar" x="46" y="60" width="8" height="50" rx="4" style="animation-delay:.45s"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-terracotta motif-wave" aria-hidden="true">
        <svg viewBox="0 0 60 140" fill="currentColor">
          <rect class="wave-bar" x="4" y="55" width="8" height="55" rx="4" style="animation-delay:.6s"/>
          <rect class="wave-bar" x="18" y="35" width="8" height="75" rx="4" style="animation-delay:.75s"/>
          <rect class="wave-bar" x="32" y="65" width="8" height="45" rx="4" style="animation-delay:.9s"/>
          <rect class="wave-bar" x="46" y="45" width="8" height="65" rx="4" style="animation-delay:1.05s"/>
        </svg>
      </div>
      <div class="hero-title container reveal-child">
        <span class="overlay" id="home-hero-overlay">CULTO DO</span>
        <span class="big" id="home-hero-title">AMIGO</span>
        <p class="hero-tagline" id="home-hero-tagline"></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="convite.html">Ver convite</a>
          <a class="btn btn-outline" href="louvores.html">Ouvir louvores</a>
        </div>
      </div>
      <a class="hero-scroll-cue" href="#home-louvores-heading" aria-label="Rolar para Louvores">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </section>

    <section class="section band-warm reveal" aria-labelledby="home-louvores-heading">
      <div class="ornament ornament-left tone-mauve" aria-hidden="true">
        <svg viewBox="0 0 110 100" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="0" y1="14" x2="110" y2="14"/>
          <line x1="0" y1="30" x2="110" y2="30"/>
          <line x1="0" y1="46" x2="110" y2="46"/>
          <line x1="0" y1="62" x2="110" y2="62"/>
          <line x1="0" y1="78" x2="110" y2="78"/>
          <g fill="currentColor" stroke="none">
            <ellipse cx="28" cy="78" rx="8" ry="5.5" transform="rotate(-16 28 78)"/>
            <rect x="34.5" y="24" width="2.6" height="54"/>
            <path d="M37 24c11 0 15 7 13 15-2-6-7-10-13-10z"/>
          </g>
        </svg>
      </div>
      <div class="ornament ornament-right tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 110 100" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="0" y1="18" x2="110" y2="18"/>
          <line x1="0" y1="34" x2="110" y2="34"/>
          <line x1="0" y1="50" x2="110" y2="50"/>
          <line x1="0" y1="66" x2="110" y2="66"/>

            <rect x="44.3" y="34" width="2.5" height="48"/>
            <path d="M46.8 34c10 0 14 6 12 14-2-6-6-9-12-9z"/>
          </g>
        </svg>
      </div>
      <div class="container">
        <div class="panel-dark reveal-child">
          <p class="panel-dark__title" id="home-louvores-heading">LOUVORES</p>
          <div class="carousel-wrap">
            <button type="button" class="carousel-nav-btn prev" aria-label="Louvores anteriores">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="carousel" id="home-carousel-track"></div>
            <button type="button" class="carousel-nav-btn next" aria-label="Próximos louvores">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <p class="carousel-panel-foot reveal-child">
          <a class="link-more" href="louvores.html">Ver todos os louvores →</a>
        </p>
      </div>
    </section>

    <div class="wave-full tone-terracotta" aria-hidden="true">
      <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
        <path d="M0,35 C240,70 480,0 720,25 C960,50 1200,70 1440,30 L1440,70 L0,70 Z"></path>
      </svg>
    </div>

    <section class="section reveal" aria-labelledby="home-lema-heading">
      <div class="ornament ornament-left tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="50" cy="50" r="34"/>
          <circle cx="50" cy="50" r="24"/>
          <path d="M50 36v28M36 50h28" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-mauve" aria-hidden="true">
        <svg viewBox="0 0 100 130" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="50" cy="46" r="30"/>
          <circle cx="50" cy="46" r="21"/>
          <path d="M50 34v24M38 46h24" stroke-linecap="round"/>
          <path d="M50 80v30" stroke-dasharray="3 5" opacity=".6"/>
        </svg>
      </div>
      <span class="section-watermark" aria-hidden="true">amigo</span>
      <div class="container">
        <div class="section-head reveal-child">
          <h2 class="script-title" id="home-lema-heading">Lema</h2>
        </div>
        <div class="content-narrow reveal-child">
          <p id="home-lema-frase"></p>
          <a class="link-more" href="tema.html">Ler mais →</a>
        </div>
      </div>
    </section>

    <div class="wave-full tone-gold" aria-hidden="true">

        <path d="M0,30 C240,0 480,70 720,40 C960,10 1200,45 1440,20 L1440,70 L0,70 Z"></path>
      </svg>
    </div>

    <section class="section band-warm reveal" aria-labelledby="home-pregacao-heading">
      <div class="ornament ornament-left tone-brown" aria-hidden="true">
        <svg viewBox="0 0 110 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 30c14-6 24-6 35 2v50c-11-8-21-8-35-2z"/>
          <path d="M45 32c11-8 21-8 35-2v50c-14-6-24-6-35 2z"/>
          <path d="M26 6l4 10M45 2v11M64 6l-4 10" opacity=".7"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 90 120" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M45 10v18M45 92v18M10 60h18M72 60h18M22 27l13 13M68 93l-13-13M22 93l13-13M68 27l-13 13" opacity=".55"/>
          <circle cx="45" cy="60" r="16"/>
        </svg>
      </div>
      <div class="container">
        <div class="section-head reveal-child">
          <h2 class="script-title" id="home-pregacao-heading">Versículo</h2>
        </div>
        <div class="paper-block content-narrow reveal-child">
          <span class="quote-mark" aria-hidden="true">&ldquo;</span>
          <p class="verse" id="home-pregacao-versiculo"></p>
          <span class="reference" id="home-pregacao-referencia"></span>
        </div>
        <p class="carousel-panel-foot reveal-child">
          <a class="link-more" href="pregacao.html">Ler mais →</a>
        </p>
      </div>
    </section>

    <div class="wave-full tone-ink" aria-hidden="true">
      <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
        <path d="M0,20 C240,55 480,10 720,35 C960,60 1200,15 1440,40 L1440,70 L0,70 Z"></path>
      </svg>
    </div>

    <section class="section band-ink reveal" aria-labelledby="home-convite-heading">
      <div class="ornament ornament-left tone-gold" aria-hidden="true">
        <svg viewBox="0 0 90 150" fill="currentColor" stroke="none">
          <path d="M22 18l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z"/>
          <path d="M62 55l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".85"/>

          <circle cx="70" cy="118" r="3.5"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-gold" aria-hidden="true">
        <svg viewBox="0 0 90 150" fill="currentColor" stroke="none">
          <path d="M60 14l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" opacity=".85"/>
          <path d="M26 58l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z"/>
          <path d="M66 108l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
          <circle cx="24" cy="24" r="3"/>
        </svg>
      </div>
      <div class="container">
        <div class="section-head reveal-child">
          <h2 class="script-title" id="home-convite-heading">Convite</h2>
        </div>
        <div class="content-narrow reveal-child">
          <p id="home-convite-texto"></p>
          <a class="link-more" href="convite.html">Ler mais →</a>
        </div>
      </div>
    </section>

  <footer class="site-footer">
    <p>AEC — Culto do Amigo</p>
  </footer>
