<!DOCTYPE html>

  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">AEC</a>
      <nav class="main-nav" aria-label="Navegação principal">

        <ul id="nav-list" class="nav-list">

        </ul>

    </div>

  <main>
    <section class="hero reveal">
      <div class="hero-title container reveal-child">
        <span class="overlay" id="home-hero-overlay">CULTO DO</span>
        <span class="big" id="home-hero-title">AMIGO</span>
      </div>
    </section>

    <section class="section band-warm reveal" aria-labelledby="home-louvores-heading">
      <div class="ornament ornament-left tone-mauve" aria-hidden="true">
        <svg viewBox="0 0 90 140" fill="none" stroke="currentColor" stroke-width="3">
          <circle cx="45" cy="35" r="18"/>
          <rect x="20" y="90" width="20" height="20" transform="rotate(18 30 100)" fill="currentColor" stroke="none"/>
          <circle cx="60" cy="120" r="6" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 80 120" fill="currentColor">
          <circle cx="10" cy="10" r="2.5"/><circle cx="30" cy="10" r="2.5"/><circle cx="50" cy="10" r="2.5"/><circle cx="70" cy="10" r="2.5"/>

            <button type="button" class="carousel-nav-btn prev" aria-label="Louvores anteriores">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="carousel" id="home-carousel-track"></div>
            <button type="button" class="carousel-nav-btn next" aria-label="Próximos louvores">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
        </div>
        <p class="carousel-panel-foot reveal-child">
          <a class="link-more" href="louvores.html">Ver todos os louvores →</a>
        </p>
      </div>
    </section>

    <div class="wave-full tone-terracotta" aria-hidden="true">
      <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
        <path d="M0,35 C240,70 480,0 720,25 C960,50 1200,70 1440,30 L1440,70 L0,70 Z"></path>
      </svg>
    </div>

    <section class="section reveal" aria-labelledby="home-lema-heading">
      <div class="ornament ornament-left tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 80 120" fill="currentColor">
          <circle cx="10" cy="10" r="2.5"/><circle cx="30" cy="10" r="2.5"/><circle cx="50" cy="10" r="2.5"/><circle cx="70" cy="10" r="2.5"/>

          <circle cx="30" cy="34" r="16"/>
          <polygon points="75,14 95,52 55,52"/>
          <rect x="18" y="96" width="20" height="20" fill="currentColor" stroke="none" transform="rotate(12 28 106)"/>
          <circle cx="78" cy="128" r="7" fill="currentColor" stroke="none"/>

      <span class="section-watermark" aria-hidden="true">amigo</span>

        </div>
      </div>

    <div class="wave-full tone-gold" aria-hidden="true">
      <svg viewBox="0 0 1440 70" preserveAspectRatio="none">
        <path d="M0,30 C240,0 480,70 720,40 C960,10 1200,45 1440,20 L1440,70 L0,70 Z"></path>
      </svg>
    </div>

    <section class="section band-warm reveal" aria-labelledby="home-pregacao-heading">
      <div class="ornament ornament-left tone-brown" aria-hidden="true">
        <svg viewBox="0 0 90 140" fill="none" stroke="currentColor" stroke-width="3">
          <polygon points="20,15 40,15 30,32" fill="currentColor" stroke="none"/>
          <circle cx="55" cy="70" r="15"/>
          <rect x="15" y="100" width="18" height="18" transform="rotate(-10 24 109)"/>
        </svg>
      </div>
      <div class="ornament ornament-right tone-terracotta" aria-hidden="true">
        <svg viewBox="0 0 80 120" fill="currentColor">
          <circle cx="10" cy="10" r="2.5"/><circle cx="30" cy="10" r="2.5"/><circle cx="50" cy="10" r="2.5"/>

        <div class="section-head reveal-child">
          <h2 class="script-title" id="home-convite-heading">Convite</h2>
        </div>
        <div class="content-narrow reveal-child">
          <p id="home-convite-texto"></p>
          <a class="link-more" href="convite.html">Ler mais →</a>

  <footer class="site-footer">
