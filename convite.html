<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volte sempre — AEC</title>
  <meta name="description" content="Volte sempre à AEC! Veja horários dos cultos, fotos, como chegar e traga um amigo.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/convite.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#15110B">
</head>
<body data-page="convite">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">AEC</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <ul id="nav-list" class="nav-list">
          <li><a href="index.html" data-page="index">Home</a></li>
          <li><a href="louvores.html" data-page="louvores">Louvores</a></li>
          <li><a href="tema.html" data-page="tema">Lema</a></li>
          <li><a href="pregacao.html" data-page="pregacao">Pregação</a></li>
          <li><a href="convite.html" data-page="convite">Volte sempre</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container convite-page">
    <div class="ornament ornament-left tone-gold" aria-hidden="true">
      <svg viewBox="0 0 90 150" fill="currentColor" stroke="none" class="spin-slow">
        <path d="M22 18l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z"/>
        <path d="M62 55l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".85"/>
        <path d="M32 100l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z"/>
        <circle cx="70" cy="118" r="3.5"/>
      </svg>
    </div>
    <div class="ornament ornament-right tone-mauve" aria-hidden="true">
      <svg viewBox="0 0 90 150" fill="currentColor" stroke="none">
        <path class="twinkle" d="M60 14l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" opacity=".85"/>
        <path class="twinkle t2" d="M26 58l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z"/>
        <circle class="twinkle t3" cx="66" cy="108" r="3"/>
      </svg>
    </div>

    <div class="section-head reveal">
      <h1 class="script-title lg" id="convite-titulo">Volte sempre</h1>
      <p class="convite-frase" id="convite-frase"></p>
    </div>

    <div class="paper-block content-narrow reveal">
      <p id="convite-texto"></p>
    </div>

    <section class="convite-sec reveal" aria-labelledby="convite-horarios-h">
      <h2 class="convite-h2" id="convite-horarios-h"></h2>
      <ul class="horarios" id="convite-horarios"></ul>
      <p class="horarios-aviso" id="convite-horarios-aviso" hidden></p>
    </section>

    <section class="convite-sec reveal" aria-labelledby="convite-grupos-h">
      <h2 class="convite-h2" id="convite-grupos-h"></h2>
      <p class="convite-sub" id="convite-grupos-sub"></p>
      <div class="carrossel" id="carrossel-grupos" data-fonte="grupos" data-nome="Fotos dos nossos grupos"></div>
    </section>

    <section class="convite-sec reveal" aria-labelledby="convite-igreja-h">
      <h2 class="convite-h2" id="convite-igreja-h"></h2>
      <p class="convite-sub" id="convite-igreja-sub"></p>
      <div class="carrossel" id="carrossel-igreja" data-fonte="igreja" data-nome="Fotos da nossa igreja e momentos"></div>
    </section>

    <section class="convite-sec reveal" aria-labelledby="convite-mapa-h">
      <h2 class="convite-h2" id="convite-mapa-h"></h2>
      <div class="mapa" id="convite-mapa">
        <div class="mapa__fallback">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <p class="endereco-text" id="convite-mapa-endereco"></p>
          <p class="mapa__nota">O mapa aparece quando você estiver online.</p>
        </div>
        <a class="mapa__pin" id="convite-maps-pin" href="#" target="_blank" rel="noopener" aria-label="Abrir a localização da AEC no Google Maps">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span>Abrir no Maps</span>
        </a>
        <iframe id="convite-mapa-iframe" class="mapa__iframe" title="Mapa do Google Maps com a localização da AEC" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </section>

    <div class="ticket-block reveal">
      <div class="ticket-block__top">
        <p class="endereco-text" id="convite-endereco"></p>
      </div>
      <div class="ticket-block__divider" aria-hidden="true"></div>
      <div class="ticket-block__actions">
        <a class="btn btn-outline" id="convite-maps-link" href="#" target="_blank" rel="noopener">Como chegar</a>
        <a class="btn btn-whatsapp" id="convite-whatsapp-link" href="#" target="_blank" rel="noopener">Traga um amigo</a>
      </div>
    </div>

    <div class="social-block">
      <p class="social-block__label">Acompanhe a gente</p>
      <a class="social-link" id="convite-instagram-link" href="#" target="_blank" rel="noopener" aria-label="Abrir o Instagram da igreja">
        <span class="social-link__icon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>
        </span>
        <span class="social-link__handle" id="convite-instagram-handle"></span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <p>AEC — Culto do Amigo</p>
  </footer>

  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="index.html" data-page="index" class="bottom-nav__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>Início</span>
    </a>
    <a href="louvores.html" data-page="louvores" class="bottom-nav__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="0.8" fill="currentColor" stroke="none"/></svg>
      <span>Louvores</span>
    </a>
    <a href="tema.html" data-page="tema" class="bottom-nav__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5.5"/><path d="M12 9v6M9 12h6"/></svg>
      <span>Lema</span>
    </a>
    <a href="pregacao.html" data-page="pregacao" class="bottom-nav__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6c3-1.5 5-1.5 8 .5v11c-3-2-5-2-8-.5z"/><path d="M20 6c-3-1.5-5-1.5-8 .5v11c3-2 5-2 8-.5z"/></svg>
      <span>Pregação</span>
    </a>
    <a href="convite.html" data-page="convite" class="bottom-nav__item">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.35-9.5-8.5C.8 8 2 4.5 5.5 4c2-.3 3.8.7 4.5 2.3C10.7 4.7 12.5 3.7 14.5 4c3.5.5 4.7 4 3 7.5C19.5 15.65 12 20 12 20z"/></svg>
      <span>Volte sempre</span>
    </a>
  </nav>

  <script src="js/nav.js" defer></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/reveal.js" defer></script>
  <script type="module" src="js/pagina-conteudo.js"></script>
  <script type="module" src="js/convite-carrossel.js"></script>
</body>
</html>
