<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>(function(){try{var t=localStorage.getItem("culto-amigo-theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite — Culto do Amigo</title>
  <meta name="description" content="Você é nosso convidado especial para o Culto do Amigo. Veja o endereço e compartilhe com um amigo.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="convite">

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">AEC</a>
      <nav class="main-nav" aria-label="Navegação principal">
        <button class="nav-toggle" aria-expanded="false" aria-controls="nav-list">
          <span class="sr-only">Abrir menu</span>
          <span class="nav-toggle-bars" aria-hidden="true"></span>
        </button>
        <ul id="nav-list" class="nav-list">
          <li><a href="index.html" data-page="index">Home</a></li>
          <li><a href="louvores.html" data-page="louvores">Louvores</a></li>
          <li><a href="tema.html" data-page="tema">Lema</a></li>
          <li><a href="pregacao.html" data-page="pregacao">Pregação</a></li>
          <li><a href="convite.html" data-page="convite">Convite</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="ornament ornament-left tone-gold" aria-hidden="true">
      <svg viewBox="0 0 90 150" fill="currentColor" stroke="none">
        <path d="M22 18l3.5 9 9 3.5-9 3.5-3.5 9-3.5-9-9-3.5 9-3.5z"/>
        <path d="M62 55l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" opacity=".85"/>
        <path d="M32 100l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z"/>
        <circle cx="70" cy="118" r="3.5"/>
      </svg>
    </div>
    <div class="ornament ornament-right tone-mauve" aria-hidden="true">
      <svg viewBox="0 0 90 150" fill="currentColor" stroke="none">
        <path d="M60 14l3 7.5 7.5 3-7.5 3-3 7.5-3-7.5-7.5-3 7.5-3z" opacity=".85"/>
        <path d="M26 58l4.5 11 11 4.5-11 4.5-4.5 11-4.5-11-11-4.5 11-4.5z"/>
        <circle cx="66" cy="108" r="3"/>
      </svg>
    </div>

    <div class="section-head reveal">
      <h1 class="script-title lg">Convite</h1>
    </div>

    <div class="paper-block content-narrow reveal">
      <p class="verse" id="convite-frase"></p>
      <p id="convite-texto"></p>
    </div>

    <div class="ticket-block reveal">
      <div class="ticket-block__top">
        <p class="endereco-text" id="convite-endereco"></p>
      </div>
      <div class="ticket-block__divider" aria-hidden="true"></div>
      <div class="ticket-block__actions">
        <a class="btn btn-outline" id="convite-maps-link" href="#" target="_blank" rel="noopener">Como chegar</a>
        <a class="btn btn-whatsapp" id="convite-whatsapp-link" href="#" target="_blank" rel="noopener">Compartilhar no WhatsApp</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>AEC — Culto do Amigo</p>
  </footer>

  <script src="js/nav.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/reveal.js" defer></script>
  <script type="module" src="js/pagina-conteudo.js"></script>
</body>
</html>
